version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pilates_db
    environment:
      - POSTGRES_DB=pilates_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
#    ports:
#      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend-dotnet
      dockerfile: Dockerfile
    container_name: pilates_api
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=pilates_db;Username=postgres;Password=password
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pilates_frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
